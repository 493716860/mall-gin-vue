      const service = ["ship","refund-approve","refund-reject","refund-retry","refund-manual","points-adjust","receive","refund-apply","cancel-order","pay","pay-success","pay-fail"];
      const finance = ["payout-approve","payout-reject","payout-success","payout-fail","freeze-release","commission-rules"];
      if (state.role==="operations") return ops.includes(action);
      if (state.role==="service") return service.includes(action);
      if (state.role==="finance") return finance.includes(action);
      return false;

      const base = Math.max(0, order.total);
      const levels = [
        { member:"林小满", level:"一级推广", rate:10 },
        { member:"许知远", level:"二级推广", rate:5 },
        { member:"陈予安", level:"三级推广", rate:3 }
      ];
      let direct = 0;
      levels.forEach((row,index)=>{
        const amount = Math.round(base*row.rate)/100;
        if(index===0) direct=amount;
        state.ledger.unshift({ id:"L-"+String(Date.now()).slice(-8)+"-"+index, orderId:order.id, member:row.member, level:row.level, rate:row.rate, amount, status:"待结算", created:"刚刚" });
      });
      state.wallet.pending += direct;
      return direct;
    }
    function updateOrderLedger(order, nextStatus) {
      state.ledger.filter(row=>row.orderId===order.id).forEach(row=>row.status=nextStatus);
    }
    function paymentResult(id, success) {
      const order = byOrder(id);
      if (!order || order.status!=="待付款") return toast("该订单当前不可支付");
      if (!success) {
        releaseReservation(order);
        order.payStatus="付款失败";
        order.paymentFailed=true;
        record(`订单 ${id} 模拟支付失败，已释放库存预占`);
        toast("支付失败，库存已释放；可重新支付");
      } else {
        if(!order.reserved) {
          const enough = order.items.every(item=>byProduct(item.productId)?.stock>=item.qty);
          if(!enough) return toast("库存不足，请调整购物袋后重试");
          order.items.forEach(item=>{const p=byProduct(item.productId);p.stock-=item.qty;});
          order.reserved=true;
        }
        order.status="待发货";
        order.payStatus="已支付";
        order.paidAt="刚刚";
        order.paymentFailed=false;
        order.commission=commissionFor(order);
        order.commissionStatus=order.commission?"待结算":"无佣金";
        record(`订单 ${id} 支付成功${order.commission?`，生成一级佣金 ${money(order.commission)}`:""}`);
        state.guideStep=Math.max(state.guideStep,3);
        toast("支付成功，订单已进入待发货");
      }
      closeModal(); render();
    }
    function shipOrder(id, formData) {
      if(!guard("ship")) return;
      const order=byOrder(id);
      if(!order||order.status!=="待发货") return toast("只有已支付的待发货订单可以发货");
      const carrier=formData.get("carrier");
      const tracking=String(formData.get("tracking")||"").trim();
      if(!tracking) return toast("请填写演示物流单号");
      order.status="待收货";
      order.tracking=`${carrier} ${tracking}`;
      order.shippedAt="刚刚";
      order.reserved=false;
      order.items.forEach(item=>{const p=byProduct(item.productId);if(p){p.sold+=item.qty;}});
      record(`订单 ${id} 已发货，物流：${order.tracking}`);
      state.guideStep=Math.max(state.guideStep,4);
      closeModal(); render(); toast("发货完成，消费者端订单已更新");
    }
    function refundResult(id, success) {
      const item=state.aftersales.find(row=>row.id===id);
      if(!item) return toast("售后单不存在");
      const order=byOrder(item.orderId);
      if(!success) {
        item.status="退款失败";
        record(`售后单 ${id} 模拟退款失败，可重试`);
        closeModal(); render(); toast("退款失败，原订单与账本未冲减");
        return;
      }
      const remainingBefore=order.total-(order.refundedAmount||0);
      const refund=Math.min(item.amount, Math.max(0,remainingBefore));
      if(refund<=0) return toast("该订单没有可退金额");
      item.status="退款完成";
      item.refunded=refund;
      order.refundedAmount=(order.refundedAmount||0)+refund;
      const bucket = order.commissionStatus==="待结算"?"pending":order.commissionStatus==="冻结中"?"frozen":order.commissionStatus==="可提现"?"available":null;
      if(order.commission && bucket) {
        const refundRatio=refund/remainingBefore;
        const delta=Math.min(state.wallet[bucket],Math.round(order.commission*refundRatio*100)/100);
        state.wallet[bucket]=Math.max(0,state.wallet[bucket]-delta);
        order.commission=Math.max(0,Math.round((order.commission-delta)*100)/100);
        if(order.commission===0) order.commissionStatus="已冲减";
        state.ledger.filter(row=>row.orderId===order.id).forEach(row=>{
          const rowDelta=Math.min(row.amount,Math.round(row.amount*refundRatio*100)/100);
          row.amount=Math.max(0,Math.round((row.amount-rowDelta)*100)/100);
          if(row.amount===0) row.status="已冲减";
        });
      } else if(["已提现","部分提现","打款成功"].includes(order.commissionStatus)) {
        item.status="人工复核";
        item.manualAmount=refund;
        order.commissionStatus="人工复核";
        updateOrderLedger(order,"人工复核");
      }
      if(order.refundedAmount>=order.total) order.status="已退款";
      else order.status=item.originalOrderStatus||"已完成";
      record(`售后单 ${id} 退款 ${money(refund)}${item.status==="人工复核"?"，已提现佣金转人工复核":"，账本同步处理"}`);
      closeModal(); render(); toast(item.status==="人工复核"?"退款已登记，佣金需人工复核":"退款模拟成功，订单与账本已同步");
    }
    function applyRefund(id, formData) {
      const order=byOrder(id);
      if(!order || !["已完成","待收货"].includes(order.status)) return toast("当前订单状态不支持申请售后");
      const amount=Number(formData.get("amount"));
      const reason=String(formData.get("reason")||"").trim();
      const remaining=order.total-(order.refundedAmount||0);
      if(!Number.isFinite(amount)||amount<=0||amount>remaining) return toast(`退款金额需在 0 至 ${money(remaining)} 之间`);
      if(!reason) return toast("请填写售后原因");
      const item={id:"AS-"+Date.now().toString().slice(-8),orderId:id,reason,amount,status:"待审核",created:"刚刚",type:amount<remaining?"部分退款":"全额退款",originalOrderStatus:order.status};
      state.aftersales.unshift(item);
      order.status="售后中";
      record(`消费者为订单 ${id} 提交 ${money(amount)} 售后申请`);

    function payoutTransition(id, outcome) {
      if(!guard(outcome==="approve"?"payout-approve":outcome==="success"?"payout-success":outcome==="fail"?"payout-fail":"payout-reject")) return;
      const item=state.payouts.find(row=>row.id===id);
      if(!item) return;
      if(outcome==="approve"&&item.status==="待审核") {
        if(state.wallet.available<item.amount) return toast("可提现余额不足，不能锁定本次申请");
        state.wallet.available-=item.amount; state.wallet.processing+=item.amount; item.status="处理中";
        record(`提现申请 ${id} 审核通过，锁定 ${money(item.amount)}`);
      } else if(outcome==="reject"&&item.status==="待审核") {
        item.status="审核拒绝"; record(`提现申请 ${id} 被拒绝`);
      } else if(outcome==="success"&&item.status==="处理中") {
        let remaining=item.amount;
        const payable=state.ledger.filter(row=>row.member===(state.member.bound||"林小满")&&row.level==="一级推广"&&["可提现","部分提现"].includes(row.status));
        const ledgerAvailable=payable.reduce((sum,row)=>sum+Math.max(0,row.amount-(row.paidAmount||0)),0);
        if(ledgerAvailable+0.001<remaining) return toast("佣金明细不足以匹配本次打款，请核对账本");
        for(const row of payable) {
          if(remaining<=0.001) break;
          const available=Math.max(0,row.amount-(row.paidAmount||0));
          const paid=Math.min(available,remaining);
          row.paidAmount=(row.paidAmount||0)+paid;
          row.status=row.paidAmount+0.001>=row.amount?"已提现":"部分提现";
          const order=byOrder(row.orderId);
          if(order) {
            order.commissionPaid=(order.commissionPaid||0)+paid;
            order.commissionStatus=order.commissionPaid+0.001>=order.commission?"已提现":"部分提现";
          }
          remaining-=paid;
        }
        state.wallet.processing=Math.max(0,state.wallet.processing-item.amount); state.wallet.paid+=item.amount; item.status="打款成功"; item.completed="刚刚";
        record(`提现申请 ${id} 模拟打款成功 ${money(item.amount)}`);
      } else if(outcome==="fail"&&item.status==="处理中") {
        state.wallet.processing=Math.max(0,state.wallet.processing-item.amount); state.wallet.available+=item.amount; item.status="打款失败";
        record(`提现申请 ${id} 打款失败，${money(item.amount)} 已释放回可提现`);
      }
      closeModal(); render(); toast(outcome==="fail"?"模拟失败，余额已释放":"提现状态已更新");
    }

            const hasChildren=state.categories.some(row=>row.parent===c.name&&row.status==="启用");
            const hasProducts=state.products.some(row=>row.category===c.name&&row.status==="在售");
            if(hasChildren||hasProducts) return toast("仍有启用子类目或在售商品，请先迁移");
            c.status="停用";
          } else c.status="启用";
          record(`类目 ${c.name} 状态更新为 ${c.status}`); render(); break;
        }
        case "stock-adjust": {
          if(!guard(action)) break;
          const p=byProduct(id); if(!p) break;
          openModal("调整库存",`<form id="modalForm" data-form="stock"><input type="hidden" name="id" value="${id}"><div class="soft-box"><div class="cell-main">${esc(p.name)}</div><div class="cell-sub">当前可售 ${p.stock} 件 · 预占库存需保持为正</div></div><div class="field" style="margin-top:11px"><label>调整后的可售库存</label><input class="input" type="number" name="stock" min="0" step="1" value="${p.stock}" required></div><div class="field"><label>调整原因</label><input class="input" name="reason" required value="盘点调整"></div></form>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" type="submit" form="modalForm">确认调整</button>`); break;
        }
        case "stock-guide": openModal("库存口径",`<div class="stack"><p>可售库存用于消费者下单；提交未支付订单时先预占。支付失败或取消订单释放预占。发货后减少实际库存、累计销量增加。</p><p class="help">当前仿真将待支付预占记录在订单上，桌面表格示例数据为初始盘点快照。</p></div>`); break;
        case "coupon-new": if(guard(action)) openModal("新建优惠券",`<form id="modalForm" data-form="coupon"><div class="field"><label>优惠券名称</label><input class="input" name="name" required maxlength="24" placeholder="如：会员满200减20"></div><div class="grid two"><div class="field"><label>使用门槛</label><input class="input" type="number" name="threshold" min="0" step="1" required></div><div class="field"><label>优惠金额</label><input class="input" type="number" name="discount" min="0.01" step="0.01" required></div></div><div class="help">模拟规则：一笔订单使用一张优惠券，退款按实付比例计算。</div></form>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" type="submit" form="modalForm">创建优惠券</button>`); break;
        case "coupon-toggle": {
          if(!guard(action)) break;
          const c=state.coupons.find(row=>row.id===id); if(c){c.status=c.status==="启用"?"停用":"启用";record(`优惠券 ${c.name} 状态更新为 ${c.status}`);}
          render(); break;
        }
        case "points-adjust": {
          if(!guard(action)) break;
          openModal("调整会员积分",`<form id="modalForm" data-form="points"><div class="soft-box"><div class="cell-main">${esc(state.member.name)} · ${state.member.id}</div><div class="cell-sub">当前积分 ${state.member.points}</div></div><div class="field" style="margin-top:11px"><label>调整数量（可正可负）</label><input class="input" type="number" name="delta" step="1" required></div><div class="field"><label>调整说明</label><input class="input" name="reason" required placeholder="必填，写明原因"></div><div class="help">积分调整只影响积分账户，不改变佣金账本。</div></form>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" type="submit" form="modalForm">确认调整</button>`); break;
        }
        case "member-detail": openModal("会员详情",`<div class="stack"><div class="row"><span>会员</span><b>${esc(state.member.name)}</b></div><div class="row"><span>等级 / 积分</span><b>${esc(state.member.level)} · ${state.member.points}</b></div><div class="row"><span>推广绑定</span><b>${esc(state.member.bound||"无")}</b></div><div class="row"><span>累计订单</span><b>${state.orders.length} 笔</b></div><div class="notice"><strong>账户分离</strong><span>积分与佣金由不同账本管理。</span></div></div>`); break;
        case "promoter-approve": {
          if(!guard(action)) break;
          const app=state.promoterApps.find(row=>row.id===id); if(!app||app.status!=="待审核") return toast("申请状态已变化");
          app.status="审核通过"; app.reviewed="刚刚"; record(`推广员申请 ${app.id} 已审核通过`); render(); toast("申请已通过"); break;
        }
        case "promoter-reject": {
          if(!guard(action)) break;
          const app=state.promoterApps.find(row=>row.id===id); if(!app||app.status!=="待审核") return toast("申请状态已变化");
          app.status="审核拒绝"; app.reviewed="刚刚"; record(`推广员申请 ${app.id} 已拒绝`); render(); toast("申请已拒绝"); break;
        }
        case "commission-rules": openModal("演示分佣规则",`<div class="stack"><p>一级推广：订单实付金额的 10%</p><p>二级推广：订单实付金额的 5%</p><p>三级推广：订单实付金额的 3%</p><div class="notice"><strong>演示假设</strong><span>比例、层级、结算周期并非已确认产品政策。有效推广员首次归属绑定；普通用户分享仅记录来源；自身订单不产生推广佣金。</span></div></div>`); break;
        case "freeze-release": {
          if(!guard(action)) break;
          if(state.wallet.frozen<=0) return toast("当前没有待解冻佣金");
          const amount=state.wallet.frozen; state.wallet.frozen=0; state.wallet.available+=amount;
          state.ledger.filter(row=>row.status==="冻结中").forEach(row=>row.status="可提现");
          state.orders.filter(order=>order.commissionStatus==="冻结中").forEach(order=>order.commissionStatus="可提现");
          record(`演示结算推进：${money(amount)} 冻结佣金转为可提现`);
          state.guideStep=Math.max(state.guideStep,6); render(); toast("冻结佣金已转为可提现"); break;
        }
        case "payout-approve": payoutTransition(id,"approve"); break;
        case "payout-reject": payoutTransition(id,"reject"); break;
        case "payout-success": payoutTransition(id,"success"); break;
        case "payout-fail": payoutTransition(id,"fail"); break;
        case "withdraw": {
          if(state.member.promoter!=="active") {
            openModal("申请推广员",`<div class="stack"><p>提交申请后由运营后台审核。通过后可生成推广链接并查看佣金。</p><div class="notice"><strong>演示规则</strong><span>推广层级最多三级，具体资质和比例以正式业务规则为准。</span></div></div>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" data-action="apply-promoter">提交申请</button>`);
            break;
          }
          openModal("申请提现",`<form id="modalForm" data-form="withdraw"><div class="soft-box"><div class="row"><span>可提现佣金</span><b>${money(state.wallet.available)}</b></div></div><div class="field" style="margin-top:11px"><label>申请金额</label><input class="input" type="number" name="amount" min="1" max="${state.wallet.available}" step="0.01" value="${Math.min(state.wallet.available,20).toFixed(2)}" required></div><div class="field"><label>演示收款渠道</label><select class="select" name="channel"><option>微信零钱（模拟）</option><option>银行卡（模拟）</option></select></div><div class="help">不会采集真实账户信息；审核通过后金额锁定，打款失败会释放回可提现。</div></form>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" type="submit" form="modalForm">提交申请</button>`); break;
        }
        case "apply-promoter": {
          if(state.promoterApps.some(a=>a.memberId===state.member.id&&a.status==="待审核")) return toast("申请已提交，请等待审核");
          if(state.member.promoter==="active") return toast("当前账户已是推广员");
          state.promoterApps.unshift({id:"PA-"+Date.now().toString().slice(-6),name:state.member.name,memberId:state.member.id,created:"刚刚",status:"待审核"});
          record(`${state.member.name} 提交推广员申请`); closeModal(); render(); toast("申请已提交");
          break;
        }
        case "share": openModal("分享商品",`<div class="stack"><p>选择分享身份，模拟不同归属规则：</p><div class="soft-box"><div class="cell-main">推广员分享</div><div class="cell-sub">有效推广员链接；新用户首次访问可建立归属</div><button class="button tiny" style="margin-top:7px" data-action="set-attribution" data-value="promoter">使用推广员分享</button></div><div class="soft-box"><div class="cell-main">普通用户分享</div><div class="cell-sub">只记录来源，不建立推广归属</div><button class="button tiny" style="margin-top:7px" data-action="set-attribution" data-value="ordinary">使用普通分享</button></div><div class="help">演示链接：qiji.local/share/${state.selectedProduct}</div></div>`,`<button class="button" data-action="modal-close">完成</button>`); break;
        case "set-attribution":
          state.attribution=node.dataset.value;
          if(state.attribution==="promoter"&&!state.member.bound) state.member.bound="林小满";
          closeModal(); toast("分享来源已设为"+(state.attribution==="promoter"?"有效推广员": "普通用户")); render(); break;
        case "edit-address": openModal("收货地址",`<form id="modalForm" data-form="address"><div class="field"><label>姓名与联系方式</label><input class="input" name="recipient" required value="林知夏 138****0268"></div><div class="field"><label>详细地址</label><input class="input" name="address" required value="杭州市 · 湖滨街道栖霞路 18 号"></div></form>`,`<button class="button" data-action="modal-close">取消</button><button class="button primary" type="submit" form="modalForm">保存地址</button>`); break;
        case "open-service": openModal("栖集在线客服",`<div class="stack"><p>${esc(state.content.service)}</p><div class="soft-box"><div class="cell-main">您好，这里是栖集演示客服。</div><div class="cell-sub">当前为离线原型，不会连接真实客服系统。订单问题可先在“我的订单”查看物流或提交售后。</div></div></div>`,`<button class="button" data-action="modal-close">关闭</button><button class="button primary" data-action="mini-nav" data-page="orders">查看订单</button>`); break;
        case "commission-rules": break;
        case "content-save": {
          if(!guard(action)) break;
          state.content.banner=$("#bannerEnabled")?.checked ?? state.content.banner;
          state.content.notice=$("#noticeText")?.value.trim()||state.content.notice;
          state.content.service=$("#serviceText")?.value.trim()||state.content.service;
          record("更新店铺首页公告与客服信息"); render(); toast("店铺设置已保存"); break;
        }
        case "policy-preview": openModal("配送与售后说明",`<p>具体运费、时效和退换条件尚未确认。正式上线前需由运营填写并与客服政策保持一致。</p><div class="pill gold">演示文案，不构成经营承诺</div>`); break;
        case "role-test": toast(state.role==="admin"?"管理员可执行全部演示操作":"已阻止：当前角色没有财务打款权限"); break;
        case "audit-clear":
          if(state.role!=="admin") return toast("仅管理员可清理演示日志");
          state.audit=[]; render(); toast("演示日志已清空"); break;
        case "export-demo": {
          const rows=[["订单号","状态","实付","支付状态"],...state.orders.map(o=>[o.id,o.status,o.total,o.payStatus])];
          const csv=rows.map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(",")).join("\n");
          const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
          const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="qiji-orders-demo.csv";link.click();URL.revokeObjectURL(link.href);
          toast("演示订单 CSV 已下载"); break;
        }
        case "overlay-close": if(node===event.target) closeModal(); break;
      }
    }

    function handleForm(form) {
      const data=new FormData(form);
      const value=name=>String(data.get(name)??"").trim();
      const number=name=>Number(data.get(name));
      switch(form.dataset.form) {
        case "product": {
          const id=value("id"), name=value("name");
          const category=state.categories.find(row=>row.name===value("category")&&row.level===2&&row.status==="启用");
          const price=number("price"), stock=number("stock");
          if(!name||!category||!Number.isFinite(price)||price<=0||!Number.isInteger(stock)||stock<0) return toast("请检查商品名称、类目、售价与库存");
          const product=id?byProduct(id):null;
          if(product) {
            Object.assign(product,{name,category:category.name,categoryPath:`${category.parent} / ${category.name}`,price,stock,label:value("label")||product.label});
            record(`编辑商品 ${product.name}，更新售价与可售库存`);
          } else {
            const next=String(state.products.length+1).padStart(3,"0");
            const created={id:`P-${next}`,name,category:category.name,categoryPath:`${category.parent} / ${category.name}`,price,stock,sold:0,status:"在售",code:String(state.products.length+1).padStart(2,"0"),label:value("label")||"OBJECT · DAILY"};
            state.products.unshift(created); record(`新建商品 ${created.name}`);
          }
          closeModal(); render(); toast(product?"商品信息已保存":"商品已创建"); break;
        }
        case "category": {
          const level=Number(value("level")), name=value("name");
          const parent=level===2?state.categories.find(row=>row.name===value("parent")&&row.level===1&&row.status==="启用"):null;
          if(!name||![1,2].includes(level)) return toast("请填写有效的类目名称");
          if(level===2&&!parent) return toast("请先创建并启用一个一级类目");
          if(state.categories.some(row=>row.name===name)) return toast("类目名称已存在");
          state.categories.push({id:`C-${String(Date.now()).slice(-5)}`,name,parent:parent?.name||"—",level,status:"启用"});
          record(`新建${level===1?"一级":"二级"}类目 ${name}${parent?`，上级 ${parent.name}`:""}`);
          closeModal(); render(); toast("类目已创建"); break;
        }
        case "ship": shipOrder(value("id"),data); break;
        case "refund": applyRefund(value("id"),data); break;
        case "stock": {
          if(!guard("stock-adjust")) break;
          const product=byProduct(value("id")), stock=number("stock"), reason=value("reason");
          if(!product||!Number.isInteger(stock)||stock<0||!reason) return toast("请填写有效库存与调整原因");
          product.stock=stock; record(`商品 ${product.name} 可售库存调整为 ${stock}，原因：${reason}`);
          closeModal(); render(); toast("库存已调整"); break;
        }
        case "coupon": {
          if(!guard("coupon-new")) break;
          const name=value("name"), threshold=number("threshold"), discount=number("discount");
          if(!name||!Number.isFinite(threshold)||threshold<0||!Number.isFinite(discount)||discount<=0) return toast("请检查优惠券名称、门槛与优惠金额");
          const coupon={id:`CP-${String(Date.now()).slice(-5)}`,name,threshold,discount,claimed:0,status:"启用"};
          state.coupons.unshift(coupon); record(`新建优惠券 ${name}，满 ${money(threshold)} 减 ${money(discount)}`);
          closeModal(); render(); toast("优惠券已创建"); break;
        }
        case "points": {
          if(!guard("points-adjust")) break;
          const delta=number("delta"), reason=value("reason");
          if(!Number.isInteger(delta)||delta===0||!reason) return toast("调整数量须为非零整数，并填写原因");
          if(state.member.points+delta<0) return toast("积分余额不足，不能扣减");
          state.member.points+=delta; record(`会员 ${state.member.id} 积分${delta>0?"增加":"扣减"} ${Math.abs(delta)}，原因：${reason}`);
          closeModal(); render(); toast("积分已调整"); break;
        }
        case "withdraw": {
          const amount=number("amount"), channel=value("channel");
          if(state.member.promoter!=="active") return toast("请先成为推广员");
          if(!Number.isFinite(amount)||amount<1||amount>state.wallet.available) return toast(`提现金额需在 ¥1.00 至 ${money(state.wallet.available)} 之间`);
          const payout={id:`PO-${String(Date.now()).slice(-8)}`,name:state.member.bound||state.member.name,amount,channel,status:"待审核",created:"刚刚"};
          state.payouts.unshift(payout); record(`提交提现申请 ${payout.id}，金额 ${money(amount)}`);
          closeModal(); state.mode="mini"; state.miniPage="wallet"; render(); toast("提现申请已提交，等待审核"); break;
        }
        case "address": {
          const recipient=value("recipient"), address=value("address");
          if(!recipient||!address) return toast("请填写收货人和详细地址");
          state.address=`${address} · ${recipient}`; record("更新演示收货地址");
          closeModal(); render(); toast("收货地址已保存"); break;
        }
      }
    }

    function bindEvents() {
      document.addEventListener("click",event=>{
        const node=event.target.closest("[data-action]");
        if(node) handleAction(node.dataset.action,node,event);
      });
      document.addEventListener("submit",event=>{
        const form=event.target.closest("form[data-form]");
        if(!form) return;
        event.preventDefault();
        if(form.reportValidity()) handleForm(form);
      });
      document.addEventListener("input",event=>{
        const input=event.target;
        if(!["miniSearch","adminSearch"].includes(input.id)) return;
        state.search=input.value;
        const id=input.id, start=input.selectionStart, end=input.selectionEnd;
        render();
        const refreshed=document.getElementById(id);
        if(refreshed) { refreshed.focus(); refreshed.setSelectionRange(start,end); }
      });
      document.addEventListener("change",event=>{
        const node=event.target;
        if(node.id==="newCategoryLevel") {
          const parentField=$("#categoryParentField");
          if(parentField) parentField.style.display=node.value==="2"?"block":"none";
        } else if(node.id==="checkoutCoupon") {
          state.selectedCoupon=node.value; render();
        } else if(node.id==="attributionSelect") {
          state.attribution=node.value;
          if(node.value==="promoter"&&!state.member.bound) state.member.bound="林小满";
          render();
        } else if(node.id==="productStatusFilter") {
          state.productStatusFilter=node.value; render();
        } else if(node.id==="adminRole") {
          state.role=node.value;
          const allowed=state.role==="finance"?["overview","commissions","payouts","audit"]:
            state.role==="service"?["overview","orders","aftersales","members","audit"]:
            state.role==="operations"?["overview","products","categories","inventory","marketing","content","audit"]:adminNav.map(item=>item[0]);
          if(!allowed.includes(state.adminPage)) state.adminPage="overview";
          render();
        }
      });
    }

    bindEvents();
    render();
  </script>
</body>
</html>
