<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品交互原型模板</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;color:#182334;background:#f4f6fa}
header{background:#fff;padding:18px 24px;border-bottom:1px solid #ddd}
main{display:grid;grid-template-columns:210px 1fr 300px;gap:16px;padding:16px}
nav,section,aside{background:white;border:1px solid #e2e5ec;border-radius:10px;padding:18px}
button,input{padding:9px 12px;border:1px solid #b8c1d0;border-radius:6px}
button{cursor:pointer;background:#eef3ff}button:focus-visible{outline:3px solid #4c72b8}
small{color:#586579}.muted{color:#667085}
@media(max-width:850px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>产品原型模板（模拟交互）</h1><small>版本 V0.1 · 业务规则未确认项标记 TBD · 此页面不连接真实后端</small></header>
<main>
<nav aria-label="功能目录"><h2>功能目录</h2><button id="home">PAGE-001 示例页面</button><p><button id="reset">重置演示数据</button></p></nav>
<section><h2>PAGE-001 示例页面</h2><p class="muted">REQ-001：演示表单校验与操作反馈</p><label for="name">示例名称（必填）</label><p><input id="name" maxlength="30" placeholder="请输入名称"></p><button id="save">保存（模拟）</button><p id="feedback" role="status" aria-live="polite">等待操作</p></section>
<aside><h2>规则与验收</h2><p>BR-001：示例字段不可为空</p><p>AC-001：Given 字段为空，When 点击保存，Then 提示必填</p><p class="muted">此规则仅用于模板演示，实际业务需确认</p></aside>
</main>
<script>
const feedback=document.getElementById('feedback');
const nameInput=document.getElementById('name');
document.getElementById('save').addEventListener('click',()=>{
 const name=nameInput.value.trim();
 feedback.textContent=name?'模拟保存成功：'+name:'校验失败：名称不能为空';
});
document.getElementById('reset').addEventListener('click',()=>{nameInput.value='';feedback.textContent='演示数据已重置';});
document.getElementById('home').addEventListener('click',()=>{nameInput.focus();feedback.textContent='已切换至 PAGE-001';});
</script>
</body></html>
